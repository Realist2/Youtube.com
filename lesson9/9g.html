<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Friend</title>
</head>
<style>
    p {
        font-family: arial;
        margin-top: 0px;
        margin-bottom: 0px;
    }
    .profile {
        width: 200px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        display: inline-block;
        margin-right: 15px;
        }
    .profile-picture {
        width: 200px;
        height: 200px;
        object-fit: cover;
        margin-bottom: 12px;        
    }
    .name {
        font-size: 18px;
        font-weight: bold;
        margin-left: 8px;
        margin-bottom: 4px;
    }
    .mutual-friends {
        color: rgb(100, 100, 100);
        margin-left: 8px;
        padding-bottom: 12px;
    }
    .add-button {
        color: white;
        background-color: rgb(24, 119, 242);
        border: none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 20px;
        padding-right: 20px;
        border-radius: 4px;
        font-size: 16px;
        margin-left: 8px;
        margin-bottom: 10px;


    }
</style>
<body>
    <div class="profile">
        <img class="profile-picture" src="cat.jpg" >
        <p class="name">Oliver</p>
        <p class="mutual-friends">2 mutual friends</p>
        <button class="add-button">Add Friend</button>
    </div>
     <div class="profile">
        <img class="profile-picture" src="cat2.jpg" >
        <p class="name">Mimi</p>
        <p class="mutual-friends">3 mutual friends</p>
        <button class="add-button">Add Friend</button>
    </div>
     <div class="profile">
        <img class="profile-picture" src="dog.jpg" >
        <p class="name">Rex</p>
        <p class="mutual-friends">4 mutual friends</p>
        <button class="add-button">Add Friend</button>
    </div>
</body>
</html>
