<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube music</title>
</head>
<style>
    p {
        font-family: arial;
        margin-top: 0px;
        margin-bottom: 0px;
    }
    .video {
        border: 1px solid rgb(33, 33, 33);
        padding-top: 20px;
        padding-bottom: 20px;
        padding-left: 15px;
        padding-right: 15px;
        width: 360px;
        background-color: rgb(50, 50, 50);
    }
    .video-title {
        color: white;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .video-description {
        color: rgb(160, 160, 160);
    }
</style>
<body>
    <div class="video">
        <p class="video-title">Install Youtube Music</p>
        <p class="video-description">Add Youtube Music to your desktop for quick and easy access</p>
    </div>
</body>
</html>
