<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    body {
        height: 3000px;
    }
    .product-container{
        position: relative;
        display: inline-block;
    }
    .product-image {
        width: 300px;
        height: 300px;
        object-fit: cover;
    }
    .promotion {
        position: absolute;
        background-color: black;
        color: white;
        top: 10px;
        right: 0px;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 12px;
        padding-right: 12px;
        font-family: Arial;
    }
</style>
<body>
    <div class="product-container">
        <img class="product-image" src="/lesson15/shirt.jpg">
        <div class="promotion">20% OFF</div>
    </div>
</body>
</html>
