<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    body {
        height: 3000px;
    }
    .bottom-right {
        background-color: gray;
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 320px;
        height: 160px;
    }
    .close-button {
        color: white;
        background-color: black;
        position: absolute;
        left: -20px;
        top: -20px;
        font-family: arial;
        font-size: 20px;
        width: 45px;
        height: 45px;
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .video-time {
        position: absolute;
        background-color: black;
        color: white;
        bottom: 10px;
        right: 10px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        font-family: Arial;
        font-size: 18px;
    }
</style>
<body>
    <div class="bottom-right">
        <div class="close-button">x</div>
        <div class="video-time">0:29</div>
    </div>
</body>
</html>
