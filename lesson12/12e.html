<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
</head>
<style>
    div {
        font-family: arial;
    }
    .flexbox {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        margin-bottom: 6px;
        margin-left: 12px;
        margin-right: 12px;
    }
    .container {
        border-color:  rgb(200, 200, 200); 
        border-width: 1px; 
        border-style: solid;
        width: 300px;
        border-radius: 6px;
    }
    .notification {
        background-color: rgb(49, 109, 245);
        color: white;
        padding-top: 3px;
        padding-bottom: 3px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
    }
</style>
<body>
    <div class="container">
    <div class="flexbox">
            <div>Home</div>
            <div class="notification">14</div>  
        </div>

        <div class="flexbox">
            <div>Notifications</div>
            <div class="notification">3</div>
        </div>
             <div class="flexbox">
            <div>Message</div>
            <div class="notification">5</div>  
        </div>
    </div>
</body>
</html>
