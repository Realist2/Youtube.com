<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
</head>
<style>
    .header {
        display: flex;
        flex-direction: row;
        height: 50px;
        
    }
    .item1 {
        display: flex;
        background-color: lightpink;
        align-items: center;
        flex-direction: row;
        width: 100px;
        justify-content: center;
    }
    .item1-icon {
        background-color: black;
        color: white;
    }
    .item2 {
        background-color: lightblue;
        width: 200px;
    }
</style>
<body>
    <div class="header">
        <div class="item1"><p class="item1-icon">item1</p></div>
        <div class="item2"></div>
    </div>
</body>
</html>
