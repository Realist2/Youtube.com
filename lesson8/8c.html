<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <style>
    .search-bar {
    font-size: 16px;
    width: 500px;
    border: none;
    padding-top: 12px;
    padding-bottom: 12px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 30px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
    }
    .google {
        width: 200px;
        display: block;
        margin-left: 150px;
        margin-bottom: 10px;
    }
    </style>
</head>
<body>
    <img class="google" src="google-logo.png" alt="">
    <input class="search-bar" type="text" placeholder="Search Google or type URL">
</body>
</html>
