<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    body {
        height: 3000px;
    }
    .right-sidebar {
        position: fixed;
        right: 0;
        bottom: 0;
        top: 0;
        background-color: green;
        width: 100px;
        color: white;
    }
    .overlay {
        background-color: rgba(0, 0, 0, 0.5);
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .modal {
        background-color: white;
        width: 300px;
        padding-top: 15px;
        padding-bottom: 15px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 5px;

    }
    .modal-title {
        font-family: arial;
        font-weight: bold;
        font-size: 24px;
        margin-bottom: 12px;
    }
    .modal-content {
        font: arial;
        margin-bottom: 12px;
    }
</style>
<body>
    <div class="right-sidebar">
       right-Sidebar
    </div>

    <div class="overlay">
        <div class="modal">
            <div class="modal-title">
                Modal Title
            </div>
            <div class="modal-content">
                This is a modal
            </div>
            <button>
                Close
            </button>
        </div>
    </div>
</body>
</html>
